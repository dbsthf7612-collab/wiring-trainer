<title>컨트롤박스 배선 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 단계 레일 | 미션 + (도면 시트 ⟷ 판넬 백플레이트) 작업대. 도면은 종이, 판넬은 아연도 강판 느낌 */
:root{
  --bg:#e6eaeb; --surface:#f6f7f7; --line:#c6cdd0; --fg:#1b2326; --muted:#5a666b;
  --paper:#ffffff; --ink:#22303a; --sky:#2a8bd6; --pink:#c42f78; --paper-edge:#9fb0bb;
  --plate:#cfd5d7; --plate-2:#c2c9cc; --rail:#8f999e; --zone:#dfe4e5;
  --dev:#f3f4f2; --dev-edge:#6f7a80; --dev-ink:#243036; --dev-2:#e4e7e6;
  --accent:#d97200; --accent-ink:#ffffff; --ok:#1d8749; --bad:#c42b2b;
  --v-l:#b4521f; --v-n:#2a6fd6; --v-p:#e48a12; --v-m:#4b5862; --v-s:#3d4348; --v-t:#8a949a;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13181a; --surface:#1b2124; --line:#313a3e; --fg:#e4e9ea; --muted:#97a3a8;
  --paper:#1a2023; --ink:#d5dee3; --sky:#5bb0ef; --pink:#ef6fab; --paper-edge:#3e4b53;
  --plate:#30383c; --plate-2:#283034; --rail:#5f6a70; --zone:#252c2f;
  --dev:#e7eae8; --dev-edge:#59646a; --dev-ink:#1f292e; --dev-2:#d3d8d6;
  --accent:#f08c1a; --accent-ink:#1a1206; --ok:#3fbf73; --bad:#ff6b6b;
  --v-l:#e07a45; --v-n:#5c98f0; --v-p:#ffab3d; --v-m:#9aa8b2; --v-s:#c9d1d6; --v-t:#7d8c95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13181a; --surface:#1b2124; --line:#313a3e; --fg:#e4e9ea; --muted:#97a3a8;
  --paper:#1a2023; --ink:#d5dee3; --sky:#5bb0ef; --pink:#ef6fab; --paper-edge:#3e4b53;
  --plate:#30383c; --plate-2:#283034; --rail:#5f6a70; --zone:#252c2f;
  --dev:#e7eae8; --dev-edge:#59646a; --dev-ink:#1f292e; --dev-2:#d3d8d6;
  --accent:#f08c1a; --accent-ink:#1a1206; --ok:#3fbf73; --bad:#ff6b6b;
  --v-l:#e07a45; --v-n:#5c98f0; --v-p:#ffab3d; --v-m:#9aa8b2; --v-s:#c9d1d6; --v-t:#7d8c95; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.55}
.wrap{max-width:1680px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
header.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-bottom:12px;border-bottom:2px solid var(--fg);margin-bottom:14px}
header.top h1{font-size:22px;margin:0;letter-spacing:-.01em;font-weight:700}
header.top .sub{color:var(--muted);font-size:13px}
.game{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.levels{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);max-height:100vh;overflow-y:auto;padding-bottom:12px}
.levels h2{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:12px 0 2px 10px;font-weight:600}
.levels h2:first-child{margin-top:0}
.lv{all:unset;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:6px;border:1px solid transparent}
.lv:hover{background:var(--surface)}
.lv:focus-visible{outline:2px solid var(--accent)}
.lv.cur{background:var(--surface);border-color:var(--line)}
.lv .no{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lv .nm{font-size:13.5px;font-weight:500;line-height:1.3}
.lv .nm small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.stars{font-size:12px;letter-spacing:1px;color:var(--line);white-space:nowrap}
.stars b{color:var(--accent);font-weight:400}
.board{min-width:0;display:flex;flex-direction:column;gap:14px}
.mission{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px}
.mission h3{margin:0 0 4px;font-size:18px;text-wrap:balance}
.mission .eyebrow{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em}
.mission p{margin:0;max-width:62ch}
.mission ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.mission li::marker{color:var(--accent)}
.views{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.card-h h4{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:auto}
.scroll{overflow-x:auto}
.sheet svg{display:block;width:100%;min-width:560px;height:auto;background:var(--paper)}
.panelbox{position:relative}
.panelbox svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:6px 12px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button:focus-visible,.btn:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{all:unset;cursor:pointer;padding:5px 11px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.tools .lbl{font-size:12px;color:var(--muted)}
.sw{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.spacer{flex:1}
.banner{margin:8px 12px 0;padding:8px 12px;border-radius:6px;font-size:13.5px;border:1px solid}
.banner.bad{border-color:var(--bad);color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.banner.info{border-color:var(--line);color:var(--fg);background:var(--bg)}
.banner.ok{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.pop{position:absolute;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:210px;font-size:13px}
.pop select{font:inherit;padding:4px 6px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.pop .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pop .ends{font-family:var(--mono);font-size:12px;color:var(--muted)}
.report{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.report ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.report li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:13.5px}
.report li .ic{font-weight:700;font-family:var(--mono)}
.report li.pass .ic{color:var(--ok)} .report li.fail .ic{color:var(--bad)} .report li.skip{color:var(--muted)}
.report li .why{grid-column:2;color:var(--bad);font-size:12.5px}
.score{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px}
.score .on{color:var(--accent)} .score .off{color:var(--muted)}
.empty{color:var(--muted);font-size:13px;margin:0}
footer.note{margin-top:18px;color:var(--muted);font-size:12px;max-width:80ch}
/* SVG: 도면 */
.s-ln{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round}
.s-ln.s-sky{stroke:var(--sky)}
.s-ln.s-fill{fill:var(--paper)}
.s-ln.s-mot{stroke:var(--pink)}
.s-ln.s-dash{stroke-dasharray:3 2}
.s-ln.s-frame{stroke:var(--paper-edge);stroke-width:1}
.s-term{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.s-dot{fill:var(--ink)}
.s-nm{fill:var(--ink);font:600 11px var(--font)}
.s-nm.s-in{font-size:9.5px}
.s-nm.s-mt{fill:var(--pink)}
.s-tn{fill:var(--muted);font:500 9px var(--mono)}
.s-num{fill:var(--pink);font:600 10px var(--mono)}
.s-hd{fill:var(--muted);font:600 10.5px var(--font);letter-spacing:.06em}
.s-tb{fill:var(--ink);font:500 10px var(--font)}
/* SVG: 판넬 */
.plate{fill:var(--plate)} .zone{fill:var(--zone);stroke:var(--line)}
.zone-t{fill:var(--muted);font:600 12px var(--font);letter-spacing:.08em}
.rail{fill:var(--rail)} .hole{fill:var(--plate-2)}
.dev{fill:var(--dev);stroke:var(--dev-edge);stroke-width:1.5}
.dev2{fill:var(--dev-2);stroke:var(--dev-edge);stroke-width:1}
.dt{fill:var(--dev-ink);font:700 14px var(--font)}
.ds{fill:var(--dev-ink);font:500 11px var(--font);opacity:.8}
.dm{fill:var(--dev-ink);font:500 10.5px var(--mono);opacity:.85}
.nm{fill:var(--fg);font:600 13px var(--font)}
.led{fill:#7d8a90;stroke:#3e474c;stroke-width:1}
.led.r{fill:#ff3b30;filter:drop-shadow(0 0 4px #ff3b30)}
.led.g{fill:#34d058;filter:drop-shadow(0 0 4px #34d058)}
.led.y{fill:#ffc400;filter:drop-shadow(0 0 4px #ffc400)}
.jumper{stroke:#c0862a;stroke-width:4;stroke-linecap:round}
.knob{fill:#2b3236;stroke:#111;stroke-width:1}
.knob-p{stroke:#fff;stroke-width:3;stroke-linecap:round}
.act{cursor:pointer}
.sim .act:hover .dev{stroke:var(--accent);stroke-width:2.5}
.lens{stroke:#3e474c;stroke-width:2}
.blade{fill:var(--dev-edge)}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{animation:wave .5s ease-in-out infinite alternate}
@keyframes wave{to{opacity:.2}}
.term{cursor:pointer}
.term .hit{fill:transparent}
.term .screw{fill:#cfd6d9;stroke:#59646a;stroke-width:1.5}
.term .x{stroke:#59646a;stroke-width:1.4}
.term text{fill:var(--dev-ink);font:600 11.5px var(--mono)}
.term:hover .screw{fill:#ffe2b8;stroke:var(--accent)}
.term.sel .screw{fill:var(--accent);stroke:var(--accent)}
.term.full .screw{stroke-dasharray:2 2}
.term.hl .ring{stroke:var(--accent);stroke-width:3;fill:none;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.2}}
.pot{fill:none;stroke-width:3.5}
.pot.L,.pot.R{stroke:var(--v-l)} .pot.N{stroke:var(--v-n)} .pot.S{stroke:var(--v-s)} .pot.T{stroke:var(--v-t)} .pot.P{stroke:var(--v-p)} .pot.M{stroke:var(--v-m)} .pot.X{stroke:#e0249b}
.wire .hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.wire .ol{stroke:rgba(0,0,0,.45);stroke-width:6.5;fill:none;stroke-linecap:round}
.wire .core{stroke-width:4;fill:none;stroke-linecap:round}
.wire:hover .ol,.wire.hl .ol{stroke:var(--accent)}
.flow{fill:none;stroke-width:2;stroke-dasharray:4 10;stroke-linecap:round;animation:flow .7s linear infinite;opacity:.9;stroke:#ffe6c8}
@keyframes flow{to{stroke-dashoffset:-14}}
.tag rect{fill:var(--surface);stroke:var(--pink);stroke-width:1.2}
.tag text{fill:var(--pink);font:600 10.5px var(--mono)}
.preview{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:6 5;pointer-events:none}
.viewtabs{display:none}
.sim .act,[data-pb]{touch-action:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion: reduce){.spin,.flow,.wave,.term.hl .ring{animation:none}}
@media (max-width:1250px){.views{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .levels{position:static;flex-direction:row;overflow-x:auto;max-height:none;align-items:flex-start}
  .levels h2{writing-mode:vertical-rl;margin:0;padding:4px 2px;border-left:2px solid var(--accent)}
  .lv{grid-template-columns:auto auto;min-width:150px;align-content:start;row-gap:2px}
  .lv .stars{grid-column:1/-1}
  .mission{grid-template-columns:minmax(0,1fr)}
  .viewtabs{display:flex}
  .viewtabs button{flex:1;text-align:center;padding:10px}
  .views[data-show="panel"] .sheet,.views[data-show="sheet"] .panelcard{display:none}
  .tools{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);z-index:3}
  .btn,.seg button{padding:8px 12px}
  .sw{width:26px;height:26px}
  header.top h1{font-size:19px}
  .pop{position:fixed;left:12px!important;right:12px;top:auto!important;bottom:calc(12px + env(safe-area-inset-bottom,0px));min-width:0}
}
</style>

<div class="wrap">
  <header class="top">
    <h1>컨트롤박스 배선 연습</h1>
    <span class="sub">도면을 보고 판넬 단자를 눌러 배선한 뒤, 전원을 넣어 동작을 확인하세요. 기초부터 전기기능사 실기 수준까지.</span>
  </header>
  <div class="game">
    <nav class="levels" id="levels" aria-label="단계"></nav>
    <section class="board">
      <div class="mission" id="mission"></div>
      <div class="seg viewtabs" role="group" aria-label="보기 전환"><button data-view="sheet" aria-pressed="false">도면 보기</button><button data-view="panel" aria-pressed="true">판넬 배선</button></div>
      <div class="views" id="views" data-show="panel">
        <div class="card sheet">
          <div class="card-h"><h4>시퀀스 도면</h4><span style="font-size:12px;color:var(--muted)"><b style="color:var(--pink)">분홍</b> 넘버링</span></div>
          <div class="scroll" id="sheet"></div>
        </div>
        <div class="card panelcard">
          <div class="card-h">
            <h4>판넬</h4>
            <div class="seg" role="group" aria-label="판넬 크기"><button data-zoom="-1" aria-label="판넬 축소">－</button><button data-zoom="1" aria-label="판넬 확대">＋</button></div>
            <div class="seg" role="group" aria-label="모드">
              <button id="mWire" aria-pressed="true">배선</button>
              <button id="mSim" aria-pressed="false">전원 투입</button>
            </div>
          </div>
          <div class="tools" id="tools"></div>
          <div id="banner"></div>
          <div class="panelbox scroll" id="panelbox"></div>
          <div class="legend" id="legend"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-h"><h4>동작 테스트 · 채점</h4></div>
        <div class="report" id="report"></div>
      </div>
      <footer class="note">연습용 시뮬레이터예요. 단자 번호는 IEC 표기(코일 A1–A2, 보조접점 13–14 · 21–22, 과부하 95–96 · 97–98)와 8핀 소켓(코일 2–7)을 기준으로 했어요. 실제 시험이나 현장에서는 도면에 주어진 기구 내부결선도의 번호를 꼭 확인하세요.</footer>
    </section>
  </div>
</div>

<script>
// ENGINE START
const range=n=>Array.from({length:n},(_,i)=>i);
const AC=['L','N','R','S','T'],PH=['R','S','T'];
function rowT(specs,w,y,dir){const n=specs.length,sp=w/n;return specs.map((s,i)=>({id:s[0],lb:s[1]??s[0],x:Math.round(sp*(i+.5)),y,dir,fixed:!!s[2],desc:s[3]||''}));}
const RELAY_T=(w,h,top,bot)=>[...rowT(top,w,18,-1),...rowT(bot,w,h-18,1)];
const DEF={
  ELB:c=>({w:120,h:160,terms:[...rowT([['1','1',1],['3','3',1]],120,18,-1),...rowT([['2','2·L',0,'ELB 2번: 2차측(부하측) L'],['4','4·N',0,'ELB 4번: 2차측(부하측) N']],120,142,1)]}),
  MCCB:c=>({w:140,h:160,terms:[...rowT([['1','1',1],['3','3',1],['5','5',1]],140,18,-1),...rowT([['2','2·R',0,'MCCB 2번: R상 부하측'],['4','4·S',0,'MCCB 4번: S상 부하측'],['6','6·T',0,'MCCB 6번: T상 부하측']],140,142,1)]}),
  FUSE:c=>({w:100,h:120,terms:[...rowT([['1','1',0,'퓨즈 F1 입력'],['3','3',0,'퓨즈 F2 입력']],100,18,-1),...rowT([['2','2',0,'퓨즈 F1 출력 (1번과 연결)'],['4','4',0,'퓨즈 F2 출력 (3번과 연결)']],100,102,1)],links:[['1','2'],['3','4']]}),
  TB:c=>{const n=c.n,w=34*n+24;return{w,h:120,terms:[...rowT(range(n).map(i=>['L'+(i+1),'L',0,'L 공통 단자대 (점퍼로 전부 연결)']),w,18,-1),...rowT(range(n).map(i=>['N'+(i+1),'N',0,'N 공통 단자대 (점퍼로 전부 연결)']),w,102,1)],links:[range(n).map(i=>'L'+(i+1)),range(n).map(i=>'N'+(i+1))]}},
  SMPS:c=>({w:170,h:130,terms:[...rowT([['L','L',0,'AC220V 입력 L'],['N','N',0,'AC220V 입력 N']],170,18,-1),...rowT([['M1','−V',0,'DC24V − 출력'],['M2','−V',0,'DC24V − 출력'],['P1','+V',0,'DC24V + 출력'],['P2','+V',0,'DC24V + 출력']],170,112,1)],links:[['M1','M2'],['P1','P2']]}),
  RELAY:c=>({w:150,h:150,terms:RELAY_T(150,150,[['1','1',0,'공통(COM): 3번과 a접점, 4번과 b접점'],['2','2',0,'코일'],['3','3',0,'a접점: 코일이 여자되면 1번과 붙음'],['4','4',0,'b접점: 평소에 1번과 붙어 있음']],[['8','8',0,'공통(COM): 6번과 a접점, 5번과 b접점'],['7','7',0,'코일'],['6','6',0,'a접점: 코일이 여자되면 8번과 붙음'],['5','5',0,'b접점: 평소에 8번과 붙어 있음']])}),

const defCache=new WeakMap();
function D(c){if(!defCache.has(c))defCache.set(c,DEF[c.type](c));return defCache.get(c);}
function UF(){const p=new Map();const f=k=>{if(!p.has(k))p.set(k,k);let r=k;while(p.get(r)!==r)r=p.get(r);let c=k;while(p.get(c)!==r){const n=p.get(c);p.set(c,r);c=n;}return r;};return{find:f,union:(a,b)=>{const x=f(a),y=f(b);if(x!==y)p.set(x,y);}};}
function lsActuated(c,st){const p=st.pos[c.motor]??50;return c.end==='open'?p>=99.9:p<=0.1;}
function dynLinks(c,st,coil){
  switch(c.type){
    case 'ELB':return st.brk?[['1','2'],['3','4']]:[];
    case 'MCCB':return st.brk?[['1','2'],['3','4'],['5','6']]:[];
    case 'RELAY':return coil[c.id]?[['1','3'],['8','6']]:[['1','4'],['8','5']];
    case 'TIMER':{const up=coil[c.id]&&(st.tm[c.id]||0)>=c.t-1e-9;return [coil[c.id]?['1','3']:['1','4'],up?['8','6']:['8','5']];}
    case 'FLICK':{const on=coil[c.id]&&Math.floor((st.fk[c.id]||0)/0.5+1e-9)%2===0;return [on?['8','6']:['8','5']];}
    case 'MC':return coil[c.id]?[['L1','T1'],['L2','T2'],['L3','T3'],['13','14'],['43','44']]:[['21','22'],['31','32']];
    case 'THR':return st.trip[c.id]?[['97','98']]:[['95','96']];
    case 'SS':return st.sw[c.id]==='ON'?[['13','14']]:[];
    case 'PB':return c.nc?(st.pb[c.id]?[]:[['11','12']]):(st.pb[c.id]?[['13','14']]:[]);
    case 'LS':return lsActuated(c,st)?[['C','NO']]:[['C','NC']];

function allKeys(lv){const ks=[];for(const c of lv.comps)for(const t of D(c).terms)ks.push(c.id+'.'+t.id);return ks;}
const COILT={RELAY:['2','7'],TIMER:['2','7'],FLICK:['2','7'],MC:['A1','A2']};
function solve(lv,wires,st){

    for(const c of lv.comps){const d=D(c),k=t=>c.id+'.'+t;
      (d.links||[]).forEach(g=>g.slice(1).forEach(t=>uf.union(k(g[0]),k(t))));
      dynLinks(c,st,coil).forEach(([a,b])=>uf.union(k(a),k(b)));}
    const tags=new Map();
    const add=(key,t)=>{const rt=uf.find(key);if(!tags.has(rt))tags.set(rt,new Set());tags.get(rt).add(t);};
    const has=(key,t)=>{const s=tags.get(uf.find(key));return !!s&&s.has(t);};
    const acOf=key=>{const s=tags.get(uf.find(key));if(!s)return null;const a=[...s].filter(t=>AC.includes(t));return a.length===1?a[0]:null;};
    const acx=(a,b)=>{const x=acOf(a),y=acOf(b);return !!x&&!!y&&x!==y;};
    const dcx=(a,b)=>(has(a,'P')&&has(b,'M'))||(has(a,'M')&&has(b,'P'));
    for(const c of lv.comps){if(c.type==='ELB'){add(c.id+'.1','L');add(c.id+'.3','N');}if(c.type==='MCCB'){add(c.id+'.1','R');add(c.id+'.3','S');add(c.id+'.5','T');}}
    const smps={};
    for(const c of lv.comps)if(c.type==='SMPS'){const on=!st.smpsTrip&&acx(c.id+'.L',c.id+'.N');smps[c.id]=on;if(on){add(c.id+'.P1','P');add(c.id+'.M1','M');}}

  if(!conv)faults.push({type:'chatter'});
  if(transient&&![...r.tags.values()].some(s=>[...s].filter(t=>AC.includes(t)).length>=2))

  for(const [rt,s] of r.tags){const acs=[...s].filter(t=>AC.includes(t));
    if(acs.length>=2)faults.push({type:'short',tags:acs,keys:inNet(rt)});
    else if(s.has('P')&&s.has('M'))faults.push({type:'dcshort',keys:inNet(rt)});
    if(acs.length&&(s.has('P')||s.has('M')))faults.push({type:'mix',keys:inNet(rt)});}
  const loads={lamp:{},fan:{},motor:{},relay:r.coil};
  for(const c of lv.comps){const k=t=>c.id+'.'+t;
    if(c.type==='LAMP'||c.type==='BZ')loads.lamp[c.id]=r.acx(k('X1'),k('X2'));
    if(c.type==='FAN')loads.fan[c.id]=r.acx(k('U1'),k('U2'));
    if(c.type==='MOTOR'){const fw=r.acx(k('FW'),k('COM')),rv=r.acx(k('RV'),k('COM'));
      if(fw&&rv)faults.push({type:'both',id:c.id});loads.motor[c.id]=fw&&rv?'BOTH':fw?'FW':rv?'RV':'STOP';}
    if(c.type==='MOTOR3'){const a=['U','V','W'].map(t=>r.acOf(k(t)));
      if(a.every(x=>!x))loads.motor[c.id]='STOP';
      else if(a.every(x=>PH.includes(x))&&new Set(a).size===3){const i=a.map(x=>PH.indexOf(x));loads.motor[c.id]=(i[1]-i[0]+3)%3===1?'FW':'RV';}
      else loads.motor[c.id]='PHASE';}
    if(c.type==='MOTOR6'){const s=['U1','V1','W1'].map(t=>r.acOf(k(t)));const distinct=s.every(x=>PH.includes(x))&&new Set(s).size===3;
      const f=t=>r.uf.find(k(t));const star=f('U2')===f('V2')&&f('V2')===f('W2')&&!r.tags.get(f('U2'));
      const delta=r.acx(k('U1'),k('U2'))&&r.acx(k('V1'),k('V2'))&&r.acx(k('W1'),k('W2'));
      loads.motor[c.id]=distinct&&delta?'D':distinct&&star?'Y':s.some(Boolean)&&!distinct?'PHASE':'STOP';}
  }
  r.burn.forEach(id=>faults.push({type:'burn',id}));
  return {...r,loads,faults};
}
function tick(lv,wires,st,dt){
  const r=solve(lv,wires,st);st.coil={...r.coil};
  if(!r.faults.length){
    for(const c of lv.comps){
      if(c.type==='TIMER')st.tm[c.id]=r.coil[c.id]?(st.tm[c.id]||0)+dt:0;
      if(c.type==='FLICK')st.fk[c.id]=r.coil[c.id]?(st.fk[c.id]||0)+dt:0;}
    for(const id in r.loads.motor){const m=r.loads.motor[id];let p=st.pos[id]??50;
      if(m==='FW')p+=30*dt;if(m==='RV')p-=30*dt;st.pos[id]=Math.max(0,Math.min(100,p));}}
  return r;
}
function initState(lv,brk=true){const st={brk,sw:{},pb:{},coil:{},tm:{},fk:{},trip:{},pos:{},smpsTrip:false,burnt:{}};
  for(const c of lv.comps){if(c.type==='SS')st.sw[c.id]='OFF';if(/^MOTOR/.test(c.type))st.pos[c.id]=50;}return st;}
const MOT={FW:'정회전',RV:'역회전',STOP:'정지',BOTH:'정·역 동시',PHASE:'결상',Y:'Y 기동',D:'Δ 운전'};
function termName(lv,key){const [cid,tid]=key.split('.');const c=lv.comps.find(x=>x.id===cid);const t=c&&D(c).terms.find(x=>x.id===tid);const lb=t?t.lb:tid;return cid+' '+(/^\d+$/.test(lb)?lb+'번':lb);}

function faultText(lv,f){const ks=f.keys&&f.keys.length?' ('+f.keys.slice(0,4).map(k=>termName(lv,k)).join(', ')+')':'';const B=brkName(lv);

    case 'short':return `단락! 전압이 다른 두 선(${f.tags.join('·')})이 부하 없이 바로 이어졌어요${ks}. ${B}가 트립됐어요.`;
    case 'dcshort':return 'SMPS 단락! +V와 −V가 바로 이어졌어요'+ks+'. SMPS 보호로 24V가 끊겼어요.';
    case 'mix':return '혼촉! 24V 회로에 220V가 섞였어요'+ks+'. '+B+'가 트립됐어요.';
    case 'both':return '정·역 동시 투입! '+f.id+' 모터 FW와 RV에 동시에 전원이 들어갔어요. 인터록을 확인하세요.';
    case 'burn':return f.id+' 코일 소손! DC24V 코일에 AC220V가 걸렸어요.';
    case 'chatter':return '채터링! 릴레이가 붙었다 떨어졌다를 반복해요. 자기 b접점으로 자기 코일을 끊고 있지 않은지 보세요.';

function runTests(lv,wires){
  const st=initState(lv);const out=[];let failed=false;
  for(const step of lv.tests){
    if(failed){out.push({say:step.say,status:'skip'});continue;}
    const s=step.set||{};if(s.sw)Object.assign(st.sw,s.sw);if(s.pb)Object.assign(st.pb,s.pb);if(s.trip)Object.assign(st.trip,s.trip);

    for(let t=0;t<T-1e-9;t+=0.1){r=tick(lv,wires,st,0.1);if(r.faults.length){fault=r.faults[0];break;}

      for(const id in e.lamp||{}){const a=!!r.loads.lamp[id];if(a!==e.lamp[id])why.push(`${id}: ${e.lamp[id]?'켜져야':'꺼져야'} 하는데 ${a?'켜져':'꺼져'} 있어요`);}
      for(const id in e.blink||{}){const s2=seen[id]||new Set();if(s2.size<2)why.push(`${id}: 깜빡여야 하는데 계속 ${s2.has(true)?'켜져':'꺼져'} 있어요`);}
      for(const id in e.fan||{}){const a=!!r.loads.fan[id];if(a!==e.fan[id])why.push(`${id}: ${e.fan[id]?'돌아야':'멈춰야'} 하는데 ${a?'돌고':'멈춰'} 있어요`);}
      for(const id in e.relay||{}){const a=!!r.loads.relay[id];if(a!==e.relay[id])why.push(`${id} 코일: ${e.relay[id]?'여자돼야':'떨어져야'} 하는데 ${a?'여자돼':'떨어져'} 있어요`);}

}
function staticUF(lv,pairs){const uf=UF();for(const c of lv.comps)(D(c).links||[]).forEach(g=>g.slice(1).forEach(t=>uf.union(c.id+'.'+g[0],c.id+'.'+t)));pairs.forEach(p=>uf.union(p[0]??p.a,p[1]??p.b));return uf;}

function diagnose(lv,wires){
  const ru=staticUF(lv,lv.ref),uu=staticUF(lv,wires);
  const wrong=wires.filter(w=>ru.find(w.a)!==ru.find(w.b));

  return {wrong,missing};
}

/* ---------- 도면 그리기 ---------- */
const S={
  l:(x1,y1,x2,y2,c='')=>`<line class="s-ln ${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`,
  p:(d,c='')=>`<path class="s-ln ${c}" d="${d}"/>`,
  t:(x,y,s,c='s-nm',a='start')=>`<text class="${c}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`,
  o:(x,y)=>`<circle class="s-term" cx="${x}" cy="${y}" r="3.2"/>`,
  d:(x,y)=>`<circle class="s-dot" cx="${x}" cy="${y}" r="3.2"/>`,
  n:(x,y,s,a='end')=>`<text class="s-num" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`,
};
const NCK=['nc','pbnc','ls','tnc'];
function E(o,x,y,c=''){const [a,b]=o.t||[];const nc=NCK.includes(o.k);let s='';
  const tx=nc?x+7:x-8,ta=nc?'start':'end';
  const tn=(a?S.t(tx,y+12,a,'s-tn',ta):'')+(b?S.t(tx,y+39,b,'s-tn',ta):'');
  const isC=o.k==='coil';
  const nm=o.n?(isC?S.t(x,y+24,o.n,'s-nm s-in','middle'):S.t(x+(nc?28:24),y+24,o.n)):'';
  const NO=()=>S.l(x,y,x,y+7,c)+S.o(x,y+10)+S.o(x,y+30)+S.l(x,y+33,x,y+40,c)+S.l(x,y+27,x+11,y+10);
  const NC=()=>S.l(x,y,x,y+7,c)+S.o(x,y+10)+S.o(x,y+30)+S.l(x,y+33,x,y+40,c)+S.l(x,y+27,x-12,y+6)+S.l(x-2,y+10,x-13,y+10);
  switch(o.k){
    case 'no':s=NO();break;
    case 'ss':s=NO()+S.l(x+6,y+19,x+17,y+19,'s-dash')+S.p(`M${x+14} ${y+13} L${x+18} ${y+13} L${x+18} ${y+25}`);break;
    case 'pbno':s=NO()+S.l(x+6,y+19,x+18,y+19,'s-dash')+S.l(x+18,y+13,x+18,y+25);break;
    case 'tno':s=NO()+S.p(`M${x+9} ${y+13} Q${x+17} ${y+19} ${x+9} ${y+25}`);break;
    case 'nc':s=NC();break;
    case 'tnc':s=NC()+S.p(`M${x-9} ${y+15} Q${x-17} ${y+21} ${x-9} ${y+27}`);break;
    case 'pbnc':s=NC()+S.l(x-7,y+19,x-21,y+19,'s-dash')+S.l(x-21,y+13,x-21,y+25);break;
    case 'ls':s=NC()+S.p(`M${x+5} ${y+21} L${x+16} ${y+15} L${x+16} ${y+27} Z`);break;
    case 'coil':s=S.l(x,y,x,y+4,c)+`<circle class="s-ln s-fill" cx="${x}" cy="${y+20}" r="16"/>`+S.l(x,y+36,x,y+40,c);break;
    case 'lamp':s=S.l(x,y,x,y+6,c)+`<circle class="s-ln s-fill" cx="${x}" cy="${y+20}" r="14"/>`+S.l(x-10,y+10,x+10,y+30)+S.l(x+10,y+10,x-10,y+30)+S.l(x,y+34,x,y+40,c);break;
    case 'bz':s=S.l(x,y,x,y+10,c)+S.p(`M${x-14} ${y+28} A14 14 0 0 1 ${x+14} ${y+28} Z`,'s-fill')+S.l(x,y+28,x,y+40,c);break;
    case 'fan':s=S.l(x,y,x,y+4,c)+`<circle class="s-ln s-fill s-mot" cx="${x}" cy="${y+20}" r="16"/>`+S.t(x,y+24,'M','s-nm s-mt','middle')+S.l(x,y+36,x,y+40,c);break;
  }
  return s+tn+nm;}
function R(x,y0,y1,items,labels=[],c=''){const k=items.length,g=(y1-y0-40*k)/(k+1);let y=y0,s='';
  for(let i=0;i<=k;i++){s+=S.l(x,y,x,y+g,c);if(labels[i])s+=S.n(x-6,y+g/2+4,labels[i]);y+=g;if(i<k){s+=E(items[i],x,y,c);y+=40;}}
  return s+S.d(x,y0)+S.d(x,y1);}
/* 병렬 묶음: list 항목을 x, x+dx, … 에 나란히 (높이 64) */
function PAR(x,y,list,dx=70){const xe=x+dx*(list.length-1);let s=S.l(x,y,xe,y)+S.l(x,y+64,xe,y+64)+S.d(x,y)+S.d(x,y+64);
  list.forEach((it,i)=>{const xi=x+dx*i;s+=S.l(xi,y,xi,y+12)+E(it,xi,y+12)+S.l(xi,y+52,xi,y+64);});return s;}
/* 범용 가로줄(rung): 항목 또는 {par:[…]} 를 위→아래로 고르게 */
function RG(x,y0,y1,parts,labels=[],dots=true){const h=p=>p.par?64:40;const tot=parts.reduce((a,p)=>a+h(p),0);const g=(y1-y0-tot)/(parts.length+1);
  let y=y0,s=dots?S.d(x,y0)+S.d(x,y1):'';
  parts.forEach((p,i)=>{s+=S.l(x,y,x,y+g);if(labels[i])s+=S.n(x-6,y+g/2+4,labels[i]);y+=g;s+=p.par?PAR(x,y,p.par,p.dx||70):E(p,x,y);y+=h(p);});
  s+=S.l(x,y,x,y1);if(labels[parts.length])s+=S.n(x-6,(y+y1)/2+4,labels[parts.length]);return s;}
function bus(x1,x2,y,label,arrow=true){return S.l(x1,y,x2,y)+(arrow?S.p(`M${x2-7} ${y-4} L${x2} ${y} L${x2-7} ${y+4}`):'')+S.n(x1,y-5,label,'start');}

  <line x1="150" y1="0" x2="150" y2="34" class="s-ln s-frame"/><line x1="206" y1="0" x2="206" y2="34" class="s-ln s-frame"/>
  ${S.t(10,21,'시퀀스 도면 · 연습','s-tb')}${S.t(178,21,'Lv.'+lvNo,'s-tb','middle')}${S.t(231,21,'1 : 1','s-tb','middle')}</g></svg>`;}

document.addEventListener('click',e=>{

  const pb=e.target.closest('[data-pb]');if(pb){e.preventDefault();app.st.pb[pb.dataset.pb]=true;simStep(0);return;}
  const a=e.target.closest('[data-act]');if(!a)return;const [k,id]=a.dataset.act.split(':');
  if(k==='brk'){app.st.brk=!app.st.brk;if(app.st.brk){app.st.smpsTrip=false;app.banner=null;}else app.banner={kind:'info',text:brkName(lv())+' 차단'};renderBanner();}
  if(k==='sw')app.st.sw[id]=app.st.sw[id]==='ON'?'OFF':'ON';
  if(k==='trip'){app.st.trip[id]=!app.st.trip[id];toast(app.st.trip[id]?'THR 트립: 과부하 상태를 흉내 냈어요. 다시 누르면 복귀.':'THR 복귀','info');}
  simStep(0);});
function releasePB(){if(app.mode!=='sim')return;let ch=false;for(const k in app.st.pb)if(app.st.pb[k]){app.st.pb[k]=false;ch=true;}if(ch)simStep(0);}
document.addEventListener('pointerup',releasePB);document.addEventListener('pointercancel',releasePB);
document.addEventListener('contextmenu',e=>{if(app.mode==='sim'&&e.target.closest('#panel'))e.preventDefault();});
let timer=null;
function startSim(){app.mode='sim';app.sel=null;app.pop=null;app.hl=[];app.st=initState(lv(),false);app.banner={kind:'info',text:brkName(lv())+'가 내려가 있어요. 판넬의 '+brkName(lv())+'를 눌러 전원을 넣으세요.'};app.sig='';
  app.r=solve(lv(),app.wires,app.st);renderTools();renderBanner();renderPanel();renderLegend();
  clearInterval(timer);timer=setInterval(()=>simStep(.1),100);}
function stopSim(){clearInterval(timer);timer=null;app.r=null;}
function simStep(dt){const l=lv(),st=app.st;let r=tick(l,app.wires,st,dt);
  if(r.faults.length){const f=r.faults[0];app.faults++;
    if(['short','mix','both','chatter'].includes(f.type))st.brk=false;
    if(f.type==='dcshort')st.smpsTrip=true;if(f.type==='burn')st.burnt[f.id]=true;
    app.banner={kind:'bad',text:faultText(l,f)};renderBanner();r=tick(l,app.wires,st,0);}
  app.r=r;
  const sig=JSON.stringify([st.brk,st.sw,st.pb,st.coil,st.trip,Object.values(st.pos).map(Math.round),Object.values(st.tm).map(v=>Math.round(v*10)),Object.values(st.fk).map(v=>Math.floor(v/0.5)),r.loads,st.smpsTrip]);
  if(sig!==app.sig){app.sig=sig;renderPanel();}}
function doTest(){const l=lv();const res=runTests(l,app.wires);const num=numberingCheck(l,app.wires);app.report={...res,num};
  if(res.pass){const s=1+(num.need>0&&num.ok===num.need?1:0)+(app.hints===0&&app.faults===0?1:0);prog.stars[l.id]=Math.max(prog.stars[l.id]||0,s);store.set(prog);
    app.banner={kind:'ok',text:'동작 테스트 통과! 도면대로 동작해요.'};}
  else app.banner={kind:'bad',text:'동작 테스트에서 걸린 곳이 있어요. 아래 결과를 확인하세요.'};
  renderLevels();renderBanner();renderReport();$('report').scrollIntoView({behavior:'smooth',block:'nearest'});}
function doHint(){const l=lv();app.hints++;const {wrong,missing}=diagnose(l,app.wires);let html;
  if(wrong.length){const w=wrong[0];app.hl=[w.a,w.b];html=`<b>도면과 다른 선:</b> ${termName(l,w.a)} ↔ ${termName(l,w.b)}. 도면에서는 이 두 단자가 같은 선으로 이어지지 않아요. 선을 눌러 삭제해 보세요.`;}
  else if(missing.length){const [a,b,lab]=missing[0];app.hl=[a,b];html=`<b>빠진 연결:</b> ${termName(l,a)} ↔ ${termName(l,b)}${lab?` (넘버링 <b style="color:var(--pink)">${lab}</b>)`:''}. 깜빡이는 두 단자를 이어 보세요. 같은 선(같은 전위)이면 다른 단자를 거쳐 건너 배선해도 정답이에요.`;}
  else html='배선이 도면과 같아요! <b>동작 테스트 ▶</b>를 눌러 보세요.';
  app.report={hint:`<p>힌트 ${app.hints}회째 · ${html}</p><p class="empty">남은 문제: 도면과 다른 선 ${wrong.length}개, 빠진 연결 ${missing.length}개</p>`};
  renderPanel();renderReport();}
let start=0;try{const id=localStorage.getItem('cbx-trainer-lvid');const i=LEVELS.findIndex(l=>l.id===id);if(i>=0)start=i;}catch(e){}
loadLevel(start);
</script>
